<!--
  UpgradR magic-link sign-in email. Mirrors supabase/config.toml's
  [auth.email.template.magic_link] for local dev; the hosted project's copy
  is edited by hand in the Supabase Dashboard (Project Settings ->
  Authentication -> Email Templates -> Magic Link) -- see the TRAP comment
  above [auth] in supabase/config.toml for why `supabase config push` must
  never be run again, and mirror any future change back into both places.

  The link deliberately does NOT use {{ .ConfirmationURL }} (Supabase's own
  hosted /verify redirect, which completes via a PKCE code exchange). That
  exchange needs a code_verifier cookie that only ever exists in the exact
  browsing context that requested the link, so it silently fails whenever
  the email is opened somewhere else -- most commonly, requested from an
  installed desktop/home-screen web app but opened from a mail client, which
  opens links in the plain browser instead, a different context. Instead
  this links straight to this app's own /api/auth/verify (apps/web/worker/
  index.ts), built from {{ .TokenHash }} and {{ .RedirectTo }} per Supabase's
  documented "redirect to a server-side endpoint" pattern -- verifyOtp only
  needs the token_hash itself, so it works no matter which browsing context
  opens it. {{ .RedirectTo }} already is the full ".../api/auth/verify?next=..."
  URL (see the /api/auth/magic-link handler), so appending the remaining two
  query params here completes it.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1a1a1a;">
  <!--
    Matches apps/web/src/styles.css .brand/.brand-mark exactly (#5b45d6,
    11-13px radius, white bold "U"). Rendered with inline-styled HTML, not
    an image: email clients commonly block remote/embedded images until
    the user clicks "show images", which would hide a real logo on first
    open. A table is used (not a div) for Outlook desktop compatibility;
    border-radius still degrades to a square there, which is an acceptable
    fallback.
  -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 28px;">
    <tr>
      <td style="width: 36px; height: 36px; min-width: 36px; border-radius: 12px; background-color: #5b45d6; text-align: center; vertical-align: middle;">
        <span style="color: #ffffff; font-size: 18px; font-weight: 800; line-height: 36px;">U</span>
      </td>
      <td style="padding-left: 10px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #171a22; white-space: nowrap;">UpgradR</td>
    </tr>
  </table>
  <p style="font-size: 15px; line-height: 1.5;">
    Click the button below to sign in to your UpgradR job-application
    tracker. This link expires shortly and can only be used once.
  </p>
  <p style="margin: 32px 0;">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=magiclink"
       style="background: #1a1a1a; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-size: 15px; display: inline-block;">
      Sign in to UpgradR
    </a>
  </p>
  <p style="font-size: 13px; color: #666; line-height: 1.5;">
    If you didn't request this, you can safely ignore this email — no
    account changes will be made.
  </p>
</div>
