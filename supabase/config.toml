# Local Supabase configuration for UpgradR.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "upgradr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New tables/views/functions are NOT auto-exposed to anon/authenticated/service_role.
# UpgradR grants privileges explicitly per table in its migrations instead of relying
# on this legacy behavior, so it is intentionally left unset (defaults to false).
# auto_expose_new_tables = true

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Keep in sync with the target hosted project's Postgres major version.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Resumes, cover letters, and profile import exports are modest in size.
file_size_limit = "20MiB"
# Buckets are created and secured by supabase/migrations (private, owner-prefixed
# paths) so they are also provisioned consistently on hosted/linked projects.

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
# Matches apps/web/.dev.vars.example APP_ORIGIN for local development.
#
# TRAP: `supabase config push` pushes this entire [auth] section, including
# these two localhost-only values, to the LINKED HOSTED PROJECT -- silently
# overwriting the production Site URL / Redirect URLs set by hand in the
# dashboard (found 2026-09-08, when pushing unrelated SMTP settings broke
# production sign-in by redirecting it to localhost:8787). There is no
# per-section push. After running `config push` for any reason, always
# re-check and, if needed, re-set Site URL and Redirect URLs in the
# dashboard (Authentication -> URL Configuration) to the production values
# in docs/deployment.md before assuming the push was side-effect-free.
site_url = "http://localhost:8787"
additional_redirect_urls = ["http://localhost:8787"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

# MCP scopes cannot ride Supabase's OAuth `scope` parameter (GoTrue rejects any
# non-OIDC scope), so the user grants them on the app's own consent screen and
# this hook injects them into the access token. See
# supabase/migrations/20250115122000_mcp_grant_scopes.sql.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/mcp_access_token_hook"

[auth.rate_limit]
# Supabase's default/shared mailer hard-caps this at 2/hour regardless of
# this value, and additionally refuses to deliver to anyone outside the
# project's own Supabase org team -- see docs/deployment.md, "Email
# delivery: Supabase's default mailer is not usable for this product".
# This higher value only takes effect once auth.email.smtp below is enabled.
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# UpgradR authenticates with magic links only; no separate confirmation step.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Custom SMTP (Brevo). Colleagues signing up with their own email cannot
# receive magic links at all through Supabase's default/shared mailer --
# see docs/deployment.md. The password is never committed; `supabase config
# push` reads it from the local shell environment at push time only.
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "env(BREVO_SMTP_LOGIN)"
pass = "env(BREVO_SMTP_KEY)"
admin_email = "env(BREVO_SENDER_EMAIL)"
sender_name = "UpgradR"

[auth.email.template.magic_link]
subject = "Your UpgradR sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
max_frequency = "5s"

# docs/architecture.md: "The preferred MCP path uses Supabase OAuth 2.1 tokens
# directly." Dynamic client registration supports MCP clients that are not
# pre-registered. Revisit alongside the MCP Worker implementation.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
