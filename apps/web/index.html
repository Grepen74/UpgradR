<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UpgradR organizes job opportunities and gives trusted agents a secure way to help."
    />
    <title>UpgradR</title>

    <!-- Open Graph / Twitter Card link-preview tags. Same static preview is
         shown for every route since this is a single-page app; update
         og:url if/when per-route previews are ever needed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UpgradR" />
    <meta property="og:title" content="UpgradR" />
    <meta
      property="og:description"
      content="UpgradR organizes job opportunities and gives trusted agents a secure way to help."
    />
    <meta property="og:url" content="https://upgradr-web.upgradr.workers.dev/" />
    <meta property="og:image" content="https://upgradr-web.upgradr.workers.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UpgradR" />
    <meta
      name="twitter:description"
      content="UpgradR organizes job opportunities and gives trusted agents a secure way to help."
    />
    <meta name="twitter:image" content="https://upgradr-web.upgradr.workers.dev/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
