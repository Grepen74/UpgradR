name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # ubuntu-latest runners ship Google Chrome's apt repo preconfigured
      # (for the runner's own preinstalled Chrome). We only need Playwright's
      # bundled Chromium binary and generic system libs -- never a package
      # from that repo -- but `playwright install --with-deps` still runs a
      # blanket `apt-get update` across every configured repo, so a broken
      # index there (e.g. dl.google.com serving a Packages.gz that doesn't
      # match its own Release file) fails the whole install. Drop that repo
      # first so it's never consulted.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
